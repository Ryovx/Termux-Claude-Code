name: 💡 Feature Request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! 💡

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: "What problem does this feature solve?"
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: "Describe what you'd like to happen"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: "Any alternative solutions or features you've considered"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: "Screenshots, links, references, etc."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions for similar ideas
          required: true
        - label: This feature fits the project's scope (Termux + Claude Code)
          required: true
