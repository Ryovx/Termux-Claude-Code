name: 🐛 Bug Report
description: Report a reproducible bug in the installer or Claude Code on Termux
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! 🙏
        Please fill out this form as completely as possible.

  - type: input
    id: termux-version
    attributes:
      label: Termux Version
      description: "Output of `termux-info`"
      placeholder: "e.g., 0.118.0"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android Version & Device
      description: "e.g., Android 14, Pixel 8"
    validations:
      required: true

  - type: input
    id: claude-version
    attributes:
      label: Claude Code Version
      description: "Output of `claude --version`"
      placeholder: "e.g., 2.1.304 (Claude Code)"
    validations:
      required: true

  - type: textarea
    id: doctor-output
    attributes:
      label: claude doctor Output
      description: "Paste the full output"
      render: shell
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `claude`
        2. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: "Copy-paste error messages, debug output, etc."
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and found no duplicate
          required: true
        - label: I am using Termux from F-Droid or GitHub Releases (not Play Store)
          required: true
        - label: I am on an aarch64 (ARM64) device
          required: true
